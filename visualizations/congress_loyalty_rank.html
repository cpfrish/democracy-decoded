<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congress Loyalty Rank</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        #vizContainer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id='vizContainer'></div>
    
    <script type='text/javascript'>
        var divElement = document.getElementById('vizContainer');
        var scriptElement = document.createElement('script');
        scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
        
        var objectElement = document.createElement('object');
        objectElement.className = 'tableauViz';
        objectElement.style.display = 'none';
        
        // ---  PARAMS ---
        objectElement.innerHTML = `
            <param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' /> 
            <param name='embed_code_version' value='3' /> 
            <param name='site_root' value='' />
            <param name='name' value='209FinalProject2/Sheet2' />
            <param name='tabs' value='no' />
            <param name='toolbar' value='yes' />
            <param name='animate_transition' value='yes' />
            <param name='display_static_image' value='yes' />
            <param name='display_spinner' value='yes' />
            <param name='display_overlay' value='yes' />
            <param name='display_count' value='yes' />
            <param name='language' value='en-US' />
        `;
        
        divElement.appendChild(objectElement);
        objectElement.parentNode.insertBefore(scriptElement, objectElement);
        

        objectElement.style.width = '100%';
        objectElement.style.height = '100%';
    </script>
</body>
</html>
