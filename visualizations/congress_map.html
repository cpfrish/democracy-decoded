<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Congress Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f9fa;
        }
        
        #container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #1a1a2e;
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin: 0 0 25px 0;
            font-size: 14px;
        }
        
        #map-container {
            position: relative;
            width: 100%;
            height: 600px;
        }
        
        .state {
            fill: #e8eaf6;
            stroke: #fff;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.2s;
        }
        
        .state:hover {
            fill: #5c6bc0;
        }
        
        .state.selected {
            fill: #3949ab;
        }
        
        #info-panel {
            margin-top: 30px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 8px;
            min-height: 150px;
        }
        
        .info-header {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 15px;
        }
        
        .rep-section {
            margin-bottom: 20px;
        }
        
        .rep-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .rep-list {
            display: grid;
            gap: 10px;
        }
        
        .rep-item {
            padding: 12px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #5c6bc0;
        }
        
        .rep-item.democrat {
            border-left-color: #2196F3;
        }
        
        .rep-item.republican {
            border-left-color: #f44336;
        }
        
        .rep-item.independent {
            border-left-color: #9E9E9E;
        }
        
        .rep-name {
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        
        .rep-details {
            font-size: 14px;
            color: #666;
        }
        
        .placeholder {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
        }
        
        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            font-size: 13px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>US Congressional Representatives Map</h1>
        <p class="subtitle">Click on any state to view its senators and representatives</p>
        
        <div id="map-container">
            <svg id="map"></svg>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #2196F3;"></div>
                <span>Democrat</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f44336;"></div>
                <span>Republican</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9E9E9E;"></div>
                <span>Independent</span>
            </div>
        </div>
        
        <div id="info-panel">
            <div class="placeholder">Click on a state to view its congressional delegation</div>
        </div>
    </div>

    <script>
        const congressData = {
    "California": {
        "senators": [
            {
                "name": "Alex Padilla",
                "party": "Democrat",
                "class": "Class III"
            },
            {
                "name": "Laphonza Butler",
                "party": "Democrat",
                "class": "Class I"
            }
        ],
        "representatives": [
            {
                "name": "Doug LaMalfa",
                "party": "Republican",
                "district": 1
            },
            {
                "name": "Jared Huffman",
                "party": "Democrat",
                "district": 2
            },
            {
                "name": "Kevin Kiley",
                "party": "Republican",
                "district": 3
            }
        ]
    },
    "Texas": {
        "senators": [
            {
                "name": "John Cornyn",
                "party": "Republican",
                "class": "Class II"
            },
            {
                "name": "Ted Cruz",
                "party": "Republican",
                "class": "Class I"
            }
        ],
        "representatives": [
            {
                "name": "Nathaniel Moran",
                "party": "Republican",
                "district": 1
            },
            {
                "name": "Dan Crenshaw",
                "party": "Republican",
                "district": 2
            },
            {
                "name": "Keith Self",
                "party": "Republican",
                "district": 3
            }
        ]
    },
    "New York": {
        "senators": [
            {
                "name": "Chuck Schumer",
                "party": "Democrat",
                "class": "Class III"
            },
            {
                "name": "Kirsten Gillibrand",
                "party": "Democrat",
                "class": "Class I"
            }
        ],
        "representatives": [
            {
                "name": "Nick LaLota",
                "party": "Republican",
                "district": 1
            },
            {
                "name": "Andrew Garbarino",
                "party": "Republican",
                "district": 2
            },
            {
                "name": "Tom Suozzi",
                "party": "Democrat",
                "district": 3
            }
        ]
    }
};

        const width = document.getElementById('map-container').clientWidth;
        const height = 600;

        const svg = d3.select("#map")
            .attr("width", width)
            .attr("height", height);

        const projection = d3.geoAlbersUsa()
            .scale(width * 1.3)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
            const states = topojson.feature(us, us.objects.states);
            
            svg.selectAll(".state")
                .data(states.features)
                .enter().append("path")
                .attr("class", "state")
                .attr("d", path)
                .on("click", function(event, d) {
                    d3.selectAll(".state").classed("selected", false);
                    d3.select(this).classed("selected", true);
                    showStateInfo(d.properties.name);
                });
            
            svg.selectAll(".state-label")
                .data(states.features)
                .enter().append("text")
                .attr("class", "state-label")
                .attr("transform", d => `translate(${path.centroid(d)})`)
                .attr("text-anchor", "middle")
                .attr("font-size", "10px")
                .attr("fill", "#666")
                .attr("pointer-events", "none")
                .text(d => {
                    const abbr = getStateAbbr(d.properties.name);
                    return abbr;
                });
        });

        function showStateInfo(stateName) {
            const panel = document.getElementById('info-panel');
            const data = congressData[stateName];
            
            if (!data) {
                panel.innerHTML = `
                    <div class="info-header">${stateName}</div>
                    <div class="placeholder">Congressional data for this state will be added soon.<br>
                    This is a demonstration showing the structure for your project.</div>
                `;
                return;
            }
            
            let html = `<div class="info-header">${stateName}</div>`;
            
            html += `<div class="rep-section">
                <h3>Senators</h3>
                <div class="rep-list">`;
            
            data.senators.forEach(senator => {
                const partyClass = senator.party.toLowerCase();
                html += `
                    <div class="rep-item ${partyClass}">
                        <div class="rep-name">${senator.name}</div>
                        <div class="rep-details">${senator.party} • ${senator.class}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            html += `<div class="rep-section">
                <h3>Representatives</h3>
                <div class="rep-list">`;
            
            data.representatives.forEach(rep => {
                const partyClass = rep.party.toLowerCase();
                html += `
                    <div class="rep-item ${partyClass}">
                        <div class="rep-name">${rep.name}</div>
                        <div class="rep-details">${rep.party} • District ${rep.district}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            panel.innerHTML = html;
        }

        function getStateAbbr(name) {
            const abbrs = {
                "Alabama": "AL", "Alaska": "AK", "Arizona": "AZ", "Arkansas": "AR",
                "California": "CA", "Colorado": "CO", "Connecticut": "CT", "Delaware": "DE",
                "Florida": "FL", "Georgia": "GA", "Hawaii": "HI", "Idaho": "ID",
                "Illinois": "IL", "Indiana": "IN", "Iowa": "IA", "Kansas": "KS",
                "Kentucky": "KY", "Louisiana": "LA", "Maine": "ME", "Maryland": "MD",
                "Massachusetts": "MA", "Michigan": "MI", "Minnesota": "MN", "Mississippi": "MS",
                "Missouri": "MO", "Montana": "MT", "Nebraska": "NE", "Nevada": "NV",
                "New Hampshire": "NH", "New Jersey": "NJ", "New Mexico": "NM", "New York": "NY",
                "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH", "Oklahoma": "OK",
                "Oregon": "OR", "Pennsylvania": "PA", "Rhode Island": "RI", "South Carolina": "SC",
                "South Dakota": "SD", "Tennessee": "TN", "Texas": "TX", "Utah": "UT",
                "Vermont": "VT", "Virginia": "VA", "Washington": "WA", "West Virginia": "WV",
                "Wisconsin": "WI", "Wyoming": "WY"
            };
            return abbrs[name] || "";
        }
    </script>
</body>
</html>
