        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f9fa;
        }
        
        #container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #1a1a2e;
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin: 0 0 15px 0;
            font-size: 14px;
        }
        
        .controls {
            gap: 20px;
            display: flex;
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-group label {
            font-size: 14px;
            font-weight: 500;
            color: #666;
        }
        
        .control-group select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        
        .zoom-controls {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        
        .zoom-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.2s;
        }
        
        .zoom-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }
        
        #map-container {
            position: relative;
            width: 100%;
            height: 600px;
        }
        
        .state {
            fill: #e8eaf6;
            stroke: #fff;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.2s;
        }
        
        .state:hover {
            fill: #5c6bc0;
        }
        
        .state.selected {
            fill: #3949ab;
        }
        
        #info-panel {
            margin-top: 30px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 8px;
            min-height: 150px;
        }
        
        .info-header {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 15px;
        }
        
        .rep-section {
            margin-bottom: 20px;
        }
        
        .rep-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .rep-list {
            display: grid;
            gap: 10px;
        }
        
        .rep-item {
            padding: 12px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #5c6bc0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .rep-item.d {
            border-left-color: #2196F3;
        }
        
        .rep-item.r {
            border-left-color: #f44336;
        }
        
        .rep-item.i {
            border-left-color: #9E9E9E;
        }
        
        .rep-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: #e0e0e0;
            flex-shrink: 0;
        }
        
        .rep-info {
            flex: 1;
        }
        
        .rep-name {
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        
        .rep-details {
            font-size: 14px;
            color: #666;
        }
        
        .placeholder {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
        }
        
        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            font-size: 13px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 12px;
            border-radius: 2px;
        }
        
        .data-info {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>US Congressional Representatives Map</h1>
        <p class="subtitle">Click on any state to view its senators and representatives</p>
        
        <div id="map-container">
            <svg id="map"></svg>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="party-filter">Filter by Party:</label>
                <select id="party-filter">
                    <option value="all">All Parties</option>
                    <option value="Democrat">Democrat</option>
                    <option value="Republican">Republican</option>
                    <option value="Independent">Independent</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="sort-by">Sort by:</label>
                <select id="sort-by">
                    <option value="district">District</option>
                    <option value="name">Name</option>
                    <option value="billCount">Bill Count</option>
                </select>
            </div>
            
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in">Zoom In</button>
                <button class="zoom-btn" id="zoom-out">Zoom Out</button>
                <button class="zoom-btn" id="zoom-reset">Reset</button>
            </div>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #2196F3;"></div>
                <span>Democrat</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f44336;"></div>
                <span>Republican</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9E9E9E;"></div>
                <span>Independent</span>
            </div>
        </div>
        
        <div id="info-panel">
            <div class="placeholder">Click on a state to view its congressional delegation</div>
        </div>
        
        <div class="data-info">
            Data from Congress.gov API
        </div>
    </div>

        let currentState = null;
        let currentPartyFilter = 'all';
        let currentSortBy = 'district';

        const width = document.getElementById('map-container').clientWidth;
        const height = 600;

        const svg = d3.select("#map")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        const projection = d3.geoAlbersUsa()
            .scale(width * 1.3)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);
        
        // Zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([1, 8])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
        
        svg.call(zoom);
        
        // Zoom controls
        document.getElementById('zoom-in').addEventListener('click', () => {
            svg.transition().call(zoom.scaleBy, 1.5);
        });
        
        document.getElementById('zoom-out').addEventListener('click', () => {
            svg.transition().call(zoom.scaleBy, 0.67);
        });
        
        document.getElementById('zoom-reset').addEventListener('click', () => {
            svg.transition().call(zoom.transform, d3.zoomIdentity);
        });
        
        // Filter and sort controls
        document.getElementById('party-filter').addEventListener('change', (e) => {
            currentPartyFilter = e.target.value;
            if (currentState) {
                showStateInfo(currentState);
            }
        });
        
        document.getElementById('sort-by').addEventListener('change', (e) => {
            currentSortBy = e.target.value;
            if (currentState) {
                showStateInfo(currentState);
            }
        });

        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
            const states = topojson.feature(us, us.objects.states);
            
            g.selectAll(".state")
                .data(states.features)
                .enter().append("path")
                .attr("class", "state")
                .attr("d", path)
                .on("click", function(event, d) {
                    g.selectAll(".state").classed("selected", false);
                    d3.select(this).classed("selected", true);
                    currentState = d.properties.name;
                    showStateInfo(d.properties.name);
                });
            
            g.selectAll(".state-label")
                .data(states.features)
                .enter().append("text")
                .attr("class", "state-label")
                .attr("transform", d => `translate(${path.centroid(d)})`)
                .attr("text-anchor", "middle")
                .attr("font-size", "10px")
                .attr("fill", "#666")
                .attr("pointer-events", "none")
                .text(d => {
                    const abbr = getStateAbbr(d.properties.name);
                    return abbr;
                });
        });

        function filterMembers(members) {
            if (currentPartyFilter === 'all') {
                return members;
            }
            const partyMap = {
                'Democrat': 'D',
                'Republican': 'R',
                'Independent': 'I'
            };
            return members.filter(m => m.party === partyMap[currentPartyFilter]);
        }
        
        function sortMembers(members, isRepresentatives) {
            const sorted = [...members];
            
            if (currentSortBy === 'name') {
                sorted.sort((a, b) => a.name.localeCompare(b.name));
            } else if (currentSortBy === 'billCount') {
                sorted.sort((a, b) => b.billCount - a.billCount);
            } else if (currentSortBy === 'district' && isRepresentatives) {
                sorted.sort((a, b) => {
                    const aVal = a.district === 'At-Large' ? 999 : a.district;
                    const bVal = b.district === 'At-Large' ? 999 : b.district;
                    return aVal - bVal;
                });
            }
            
            return sorted;
        }

        function showStateInfo(stateName) {
            const panel = document.getElementById('info-panel');
            const data = congressData[stateName];
            
            if (!data) {
                panel.innerHTML = `
                    <div class="info-header">${stateName}</div>
                    <div class="placeholder">No congressional data available for this state.</div>
                `;
                return;
            }
            
            let html = `<div class="info-header">${stateName}</div>`;
            
            // Filter and sort senators
            let senators = filterMembers(data.senators);
            senators = sortMembers(senators, false);
            
            html += `<div class="rep-section">
                <h3>Senators (${senators.length})</h3>
                <div class="rep-list">`;
            
            if (senators.length === 0) {
                html += `<div class="placeholder">No senators match the current filter.</div>`;
            } else {
                senators.forEach(senator => {
                    const partyClass = senator.party.toLowerCase();
                    const photoHtml = senator.photoUrl ? 
                        `<img src="${senator.photoUrl}" alt="${senator.name}" class="rep-photo">` :
                        `<div class="rep-photo"></div>`;
                    
                    html += `
                        <div class="rep-item ${partyClass}">
                            ${photoHtml}
                            <div class="rep-info">
                                <div class="rep-name">${senator.name}</div>
                                <div class="rep-details">${senator.party} • ${senator.billCount} bills</div>
                            </div>
                        </div>
                    `;
                });
            }
            
            html += `</div></div>`;
            
            // Filter and sort representatives
            let representatives = filterMembers(data.representatives);
            representatives = sortMembers(representatives, true);
            
            html += `<div class="rep-section">
                <h3>Representatives (${representatives.length})</h3>
                <div class="rep-list">`;
            
            if (representatives.length === 0) {
                html += `<div class="placeholder">No representatives match the current filter.</div>`;
            } else {
                representatives.forEach(rep => {
                    const partyClass = rep.party.toLowerCase();
                    const districtLabel = rep.district === 'At-Large' ? 'At-Large' : `District ${rep.district}`;
                    const photoHtml = rep.photoUrl ? 
                        `<img src="${rep.photoUrl}" alt="${rep.name}" class="rep-photo">` :
                        `<div class="rep-photo"></div>`;
                    
                    html += `
                        <div class="rep-item ${partyClass}">
                            ${photoHtml}
                            <div class="rep-info">
                                <div class="rep-name">${rep.name}</div>
                                <div class="rep-details">${rep.party} • ${districtLabel} • ${rep.billCount} bills</div>
                            </div>
                        </div>
                    `;
                });
            }
            
            html += `</div></div>`;
            
            panel.innerHTML = html;
        }

        function getStateAbbr(name) {
            const abbrs = {
                "Alabama": "AL", "Alaska": "AK", "Arizona": "AZ", "Arkansas": "AR",
                "California": "CA", "Colorado": "CO", "Connecticut": "CT", "Delaware": "DE",
                "Florida": "FL", "Georgia": "GA", "Hawaii": "HI", "Idaho": "ID",
                "Illinois": "IL", "Indiana": "IN", "Iowa": "IA", "Kansas": "KS",
                "Kentucky": "KY", "Louisiana": "LA", "Maine": "ME", "Maryland": "MD",
                "Massachusetts": "MA", "Michigan": "MI", "Minnesota": "MN", "Mississippi": "MS",
                "Missouri": "MO", "Montana": "MT", "Nebraska": "NE", "Nevada": "NV",
                "New Hampshire": "NH", "New Jersey": "NJ", "New Mexico": "NM", "New York": "NY",
                "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH", "Oklahoma": "OK",
                "Oregon": "OR", "Pennsylvania": "PA", "Rhode Island": "RI", "South Carolina": "SC",
                "South Dakota": "SD", "Tennessee": "TN", "Texas": "TX", "Utah": "UT",
                "Vermont": "VT", "Virginia": "VA", "Washington": "WA", "West Virginia": "WV",
                "Wisconsin": "WI", "Wyoming": "WY"
            };
            return abbrs[name] || "";
        }
